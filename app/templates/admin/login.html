<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900/80 border border-slate-800 p-8 rounded-2xl shadow-2xl backdrop-blur">
        <div class="text-center mb-6">
            <span class="px-2.5 py-1 text-[11px] font-bold uppercase tracking-wider bg-rose-950/80 text-rose-300 border border-rose-800/60 rounded">Secure Admin Area</span>
            <h1 class="text-xl font-bold text-white mt-3">অ্যাডমিন প্রবেশদ্বার</h1>
            <p class="text-xs text-slate-400 mt-1">প্রশাসনিক প্যানেল নিয়ন্ত্রণের জন্য লগইন করুন</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-xl text-xs font-medium {% if category == 'danger' %} bg-rose-950/40 text-rose-300 border border-rose-800/50 {% else %} bg-emerald-950/40 text-emerald-300 border border-emerald-800/50 {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">অ্যাডমিন ইউজারনেম</label>
                <input type="text" name="username" placeholder="admin" required class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">অ্যাডমিন পাসওয়ার্ড</label>
                <input type="password" name="password" placeholder="••••" required class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-xs shadow-lg shadow-indigo-600/20 transition">অ্যাডমিন লগইন</button>
        </form>

        <div class="text-center mt-6">
            <a href="{{ url_for('dashboard.index') }}" class="text-xs text-slate-400 hover:text-white transition">← ইউজার ড্যাশবোর্ডে ফিরুন</a>
        </div>
    </div>
</body>
</html>
